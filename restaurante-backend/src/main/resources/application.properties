# ============================================
# Conexion a MySQL (XAMPP local)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
# update: no borra tus tablas, solo ajusta si falta algo.
# Como ya creaste las tablas con el script SQL, esto es seguro.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Puerto del servidor
# ============================================
server.port=8080

# Para que los mensajes de error (ej. "No se puede eliminar...") se vean
# en la respuesta JSON en vez de un mensaje generico
server.error.include-message=always
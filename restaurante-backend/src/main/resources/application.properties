# ============================================
# Conexion a MySQL (XAMPP local)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Puerto del servidor
# ============================================
server.port=8080

# Para que los mensajes de error personalizados se vean en las respuestas JSON
server.error.include-message=always

# ============================================
# Microservicio de recomendaciones (Python)
# ============================================
ml.service.url=http://localhost:5000